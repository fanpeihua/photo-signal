name: Collect and publish Photo Signal
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [site/photo-signal]
    paths-ignore: ['data/public-snapshot.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: photo-signal-publish
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check behavior
        run: |
          python3 check.py
          node check-metrics.js
          node check-insights.js
          node --check web/app.js
      - name: Restore durable history
        run: |
          if [ -f data/public-snapshot.json ]; then
            python3 radar.py restore
          fi
      - name: Collect public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 radar.py collect
      - name: Build and persist public snapshot
        run: |
          python3 radar.py export
          cp dist/snapshot.json data/public-snapshot.json
          git add data/public-snapshot.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh public photography signals'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
